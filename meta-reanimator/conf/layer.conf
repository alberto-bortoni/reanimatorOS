# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-reanimator"
BBFILE_PATTERN_meta-reanimator = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-reanimator = "6"

LAYERDEPENDS_meta-reanimator = "core"
LAYERSERIES_COMPAT_meta-reanimator = "kirkstone"
